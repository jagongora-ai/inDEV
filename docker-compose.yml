services:
  mysql:
    image: mysql:8.4
    container_name: zenvok-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8762:8761"

  estado-service:
    build: ./estado
    container_name: estado-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bd_estado?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  usuario-service:
    build: ./GestionUsuario
    container_name: usuario-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bd_usuarios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  producto-service:
    build: ./producto
    container_name: producto-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bd_producto?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      estado-service:
        condition: service_started

  direccion-service:
    build: ./direccion
    container_name: direccion-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bd_direccion?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      MS_USUARIO_URL: http://usuario-service:8081
      MS_ESTADO_URL: http://estado-service:8083
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      usuario-service:
        condition: service_started
      estado-service:
        condition: service_started

  bodega-service:
    build: ./bodega
    container_name: bodega-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bd_bodega?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      PRODUCTO_SERVICE_URL: http://producto-service:8084/api/productos
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      producto-service:
        condition: service_started

  venta-service:
    build: ./venta
    container_name: venta-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bd_ventas?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      USUARIO_SERVICE_URL: http://usuario-service:8081/api/usuarios
      ESTADO_SERVICE_URL: http://estado-service:8083/api/estados
      PRODUCTO_SERVICE_URL: http://producto-service:8084/api/productos
      BODEGA_SERVICE_URL: http://bodega-service:8085/api/productos_ubicaciones
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      usuario-service:
        condition: service_started
      estado-service:
        condition: service_started
      producto-service:
        condition: service_started
      bodega-service:
        condition: service_started

  envio-service:
    build: ./envios
    container_name: envio-service
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bd_envios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      MS_DIRECCION_URL: http://direccion-service:8082
      MS_ESTADO_URL: http://estado-service:8083
      MS_VENTA_URL: http://venta-service:8086
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      direccion-service:
        condition: service_started
      estado-service:
        condition: service_started
      venta-service:
        condition: service_started

  configuracion-service:
    build: ./Configuracion
    container_name: configuracion-service
    ports:
      - "8088:8088"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bd_configuracion?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_started
      estado-service:
        condition: service_started
      usuario-service:
        condition: service_started
      direccion-service:
        condition: service_started
      producto-service:
        condition: service_started
      bodega-service:
        condition: service_started
      venta-service:
        condition: service_started
      envio-service:
        condition: service_started
      configuracion-service:
        condition: service_started

volumes:
  mysql_data: